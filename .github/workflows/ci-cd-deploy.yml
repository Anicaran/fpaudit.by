name: CI/CD Deploy

on:
  push:
    branches:
      - main
  # Deploy is MANUAL ONLY. Do not auto-deploy on push:
  # a previous rsync --delete against DEPLOY_PATH wiped unrelated server files.
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type deploy to run CD (CI always runs on push)'
        required: true
        default: ''

jobs:
  ci:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fpa-mobile-web/server/requirements.txt

      - name: Backend syntax check
        run: |
          python -m py_compile fpa-mobile-web/server/main.py
          python -m py_compile fpa-mobile-web/server/audit_client.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fpa-mobile-web/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: fpa-mobile-web/client
        run: npm ci

      - name: Build frontend
        working-directory: fpa-mobile-web/client
        run: npm run build

  cd:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    needs: ci
    # Never deploy on push. Manual run + explicit confirmation only.
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm_deploy == 'deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # Refuse empty / relative / filesystem-root targets.
          case "$DEPLOY_PATH" in
            /|/root|/home|/var|/var/www|/usr|/etc|"")
              echo "Refusing unsafe DEPLOY_PATH=$DEPLOY_PATH"
              exit 1
              ;;
          esac
          if [[ "$DEPLOY_PATH" != /* ]]; then
            echo "DEPLOY_PATH must be an absolute path, got: $DEPLOY_PATH"
            exit 1
          fi
          base="$(basename "$DEPLOY_PATH")"
          if [[ "$base" == "www" || "$base" == "html" || "$base" == "public_html" || "$base" == "home" ]]; then
            echo "DEPLOY_PATH looks like a shared web root ($DEPLOY_PATH). Use a dedicated app directory."
            exit 1
          fi
          echo "Deploy target: ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"

      - name: Configure SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          port="${SSH_PORT:-22}"
          ssh-keyscan -p "$port" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote deploy directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}'"

      - name: Sync project to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"

          # Sync ONLY the app tree into a dedicated directory.
          # No --delete (safer after the previous wipe incident).
          rsync -az \
            -e "ssh -p ${port}" \
            --exclude ".git/" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude ".venv/" \
            --exclude "venv/" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "certs/" \
            --exclude "*.log" \
            --exclude "__pycache__/" \
            ./fpa-mobile-web/ \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Build and restart service on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_RESTART_CMD: ${{ secrets.DEPLOY_RESTART_CMD }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" "${SSH_USER}@${SSH_HOST}" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            DEPLOY_RESTART_CMD="$DEPLOY_RESTART_CMD" \
            bash -s <<'EOF'
          set -euo pipefail
          echo "Using DEPLOY_PATH=$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
          fi
          apt-get update -y
          apt-get install -y python3 python3-venv python3-pip

          cd "$DEPLOY_PATH/client"
          npm ci
          npm run build

          cd "$DEPLOY_PATH/server"
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          printf '%s\n' \
            '[Unit]' \
            'Description=FP Audit Mobile Web Backend' \
            'After=network.target' \
            '' \
            '[Service]' \
            'Type=simple' \
            'User=root' \
            "WorkingDirectory=${DEPLOY_PATH}/server" \
            'Environment=PYTHONUNBUFFERED=1' \
            "ExecStart=${DEPLOY_PATH}/server/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000" \
            'Restart=always' \
            'RestartSec=3' \
            '' \
            '[Install]' \
            'WantedBy=multi-user.target' \
            > /etc/systemd/system/fpa-mobile-web.service

          systemctl daemon-reload
          systemctl enable fpa-mobile-web
          systemctl restart fpa-mobile-web
          systemctl --no-pager --full status fpa-mobile-web || true
          curl -fsS "http://127.0.0.1:8000/api/health" || true

          if [ -n "${DEPLOY_RESTART_CMD:-}" ]; then
            eval "$DEPLOY_RESTART_CMD"
          fi
          EOF
