name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fpa-mobile-web/server/requirements.txt

      - name: Backend syntax check
        run: |
          python -m py_compile fpa-mobile-web/server/main.py
          python -m py_compile fpa-mobile-web/server/audit_client.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fpa-mobile-web/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: fpa-mobile-web/client
        run: npm ci

      - name: Build frontend
        working-directory: fpa-mobile-web/client
        run: npm run build

  cd:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          touch ~/.ssh/known_hosts
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "fpa-mobile-web/client/node_modules" \
            --exclude "fpa-mobile-web/client/dist" \
            --exclude "fpa-mobile-web/server/.venv" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Build and restart service on server
        run: |
          ssh -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
          set -e
          cd "${{ secrets.DEPLOY_PATH }}"

          cd fpa-mobile-web/client
          npm ci
          npm run build

          cd ../server
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          if [ -n "${{ secrets.DEPLOY_RESTART_CMD }}" ]; then
            eval "${{ secrets.DEPLOY_RESTART_CMD }}"
          fi
          EOF
